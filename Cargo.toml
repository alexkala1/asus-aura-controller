[package]
name = "luminactl"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Pure Linux CLI, MCP server, and Web Studio for RGB lighting — reverse-engineered for ASUS Aura Sync hardware"
license = "MIT"
repository = "https://github.com/alexkala1/luminactl"
homepage = "https://github.com/alexkala1/luminactl"
readme = "README.md"
keywords = ["rgb", "lighting", "hardware", "mcp", "linux"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "luminactl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
